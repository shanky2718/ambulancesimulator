<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" role="img" aria-labelledby="route-title route-desc">
  <title id="route-title">ASTRARESQ Incident Tactical Route Intelligence Map</title>
  <desc id="route-desc">Detailed vector route map showing Ambulance A-04 transit path to MG Road cardiac emergency and subsequent evacuation corridor to Victoria Emergency Trauma Centre.</desc>

  <defs>
    <!-- Tactical Style Block with Pure CSS/SVG Animations -->
    <style><![CDATA[
      /* 1. Animated Route Progression (Flowing directional dash) */
      .route-flow-line {
        stroke-dasharray: 14 10;
        animation: routeFlow 2s linear infinite;
      }
      @keyframes routeFlow {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }

      /* 2. Secondary Evacuation Corridor Pulse */
      .route-evac-line {
        stroke-dasharray: 8 6;
        animation: evacFlow 2.5s linear infinite;
      }
      @keyframes evacFlow {
        from { stroke-dashoffset: 28; }
        to { stroke-dashoffset: 0; }
      }

      /* 3. Pulsating Emergency Incident Radar Beacon */
      .incident-radar-pulse {
        transform-origin: 500px 220px;
        animation: radarPing 2.4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
      @keyframes radarPing {
        0% { r: 12px; opacity: 0.9; stroke-width: 2.5px; }
        50% { opacity: 0.45; }
        100% { r: 42px; opacity: 0; stroke-width: 0.5px; }
      }

      .incident-radar-pulse-2 {
        transform-origin: 500px 220px;
        animation: radarPing 2.4s cubic-bezier(0.2, 0.8, 0.4, 1) 1.2s infinite;
      }

      /* 4. Radar Sweep Line (Tactical 360 degree scan) */
      .radar-sweep-beam {
        transform-origin: 500px 280px;
        animation: radarSweep 8s linear infinite;
      }
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* 5. Preempted Traffic Signal Beacons */
      .signal-beacon {
        animation: signalBlink 2s ease-in-out infinite alternate;
      }
      @keyframes signalBlink {
        0% { fill: #00e676; filter: drop-shadow(0 0 2px #00e676); }
        100% { fill: #b9f6ca; filter: drop-shadow(0 0 8px #00e676); }
      }

      /* 6. Ambulance Movement Animation Along the Emergency Route */
      .moving-ambulance-group {
        offset-path: path("M 820,140 L 720,220 L 500,220 L 280,220 L 160,360");
        offset-rotate: auto;
        animation: ambulanceTransit 14s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      @keyframes ambulanceTransit {
        0% {
          offset-distance: 0%;
        }
        /* Transit from Staging Outpost to Turn 1 */
        22% {
          offset-distance: 22%;
        }
        /* Arrival at MG Road Incident Scene */
        42% {
          offset-distance: 46%;
        }
        /* Patient Stabilization and Triage Loading Pause at Scene */
        62% {
          offset-distance: 46%;
        }
        /* Rapid Evacuation Transit to Victoria Trauma Centre */
        92% {
          offset-distance: 100%;
        }
        100% {
          offset-distance: 100%;
        }
      }

      /* Emergency Beacon Strobe on Ambulance */
      .amb-strobe-red {
        animation: strobeRed 0.8s steps(2, start) infinite;
      }
      .amb-strobe-cyan {
        animation: strobeCyan 0.8s steps(2, start) 0.4s infinite;
      }
      @keyframes strobeRed {
        0%, 100% { fill: #ff2a44; opacity: 1; }
        50% { fill: #ff2a44; opacity: 0.2; }
      }
      @keyframes strobeCyan {
        0%, 100% { fill: #00f0ff; opacity: 1; }
        50% { fill: #00f0ff; opacity: 0.2; }
      }

      /* 7. Prefers-Reduced-Motion Media Query */
      @media (prefers-reduced-motion: reduce) {
        .route-flow-line,
        .route-evac-line,
        .incident-radar-pulse,
        .incident-radar-pulse-2,
        .radar-sweep-beam,
        .signal-beacon,
        .moving-ambulance-group,
        .amb-strobe-red,
        .amb-strobe-cyan {
          animation: none !important;
        }

        /* Lock the ambulance to active MG Road incident site */
        .moving-ambulance-group {
          offset-distance: 46% !important;
        }

        .incident-radar-pulse {
          r: 28px !important;
          opacity: 0.4 !important;
          stroke-width: 2px !important;
        }
        .incident-radar-pulse-2 {
          display: none !important;
        }
      }
    ]]></style>

    <!-- Grid Pattern -->
    <pattern id="tactical-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#151e2a" stroke-width="1" />
    </pattern>
    <pattern id="tactical-subgrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="none" stroke="#1f2c3d" stroke-width="1.5" />
    </pattern>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00f0ff" />
    </marker>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="560" fill="#080c12" />
  <rect width="1000" height="560" fill="url(#tactical-grid)" />
  <rect width="1000" height="560" fill="url(#tactical-subgrid)" />

  <!-- Radar Range Concentric Circles -->
  <g stroke="#00f0ff" stroke-opacity="0.12" fill="none">
    <circle cx="500" cy="280" r="100" stroke-dasharray="4 4" />
    <circle cx="500" cy="280" r="200" stroke-dasharray="6 6" />
    <circle cx="500" cy="280" r="320" stroke-dasharray="8 8" />
    <line x1="500" y1="20" x2="500" y2="540" stroke-opacity="0.1" />
    <line x1="40" y1="280" x2="960" y2="280" stroke-opacity="0.1" />
  </g>

  <!-- Animated Rotating Radar Sweep Beam -->
  <g class="radar-sweep-beam">
    <line x1="500" y1="280" x2="820" y2="280" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.45" />
    <path d="M 500,280 L 820,280 A 320 320 0 0 0 770,120 Z" fill="#00f0ff" fill-opacity="0.04" />
  </g>

  <!-- Street Layout (Bengaluru Central Grid) -->
  <g stroke="#1a2738" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer arterials -->
    <path d="M 80,80 L 920,80" />
    <path d="M 80,480 L 920,480" />
    <path d="M 80,80 L 80,480" />
    <path d="M 920,80 L 920,480" />
    <!-- Major thoroughfares -->
    <path d="M 80,220 L 920,220" />
    <path d="M 80,360 L 920,360" />
    <path d="M 280,80 L 280,480" />
    <path d="M 500,80 L 500,480" />
    <path d="M 720,80 L 720,480" />
    <!-- Diagonal connections -->
    <path d="M 280,220 L 500,360" />
    <path d="M 500,220 L 720,80" />
    <path d="M 720,360 L 920,220" />
  </g>

  <!-- Street Names (Tactical typography) -->
  <g fill="#4e627a" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="11" letter-spacing="1.5">
    <text x="300" y="70">KASTURBA ROAD</text>
    <text x="300" y="210">MG ROAD CORRIDOR [PRIMARY]</text>
    <text x="300" y="350">RESIDENCY ROAD</text>
    <text x="300" y="470">RICHMOND CIRCLE FLYOVER</text>
    <text x="90" y="160" transform="rotate(-90 90,160)">STATION ACCESS</text>
    <text x="290" y="160" transform="rotate(-90 290,160)">BRIGADE ROAD</text>
    <text x="510" y="160" transform="rotate(-90 510,160)">COMMISSARIAT RD</text>
    <text x="730" y="160" transform="rotate(-90 730,160)">OLD AIRPORT RD</text>
  </g>

  <!-- Signal Preemption Indicators (Green corridor with pulse) -->
  <g fill="#00e676" font-family="'SF Mono', monospace" font-size="9">
    <circle cx="280" cy="220" r="5" class="signal-beacon" />
    <text x="292" y="223">SIGNAL 01: PREEMPTED</text>
    <circle cx="500" cy="220" r="5" class="signal-beacon" />
    <text x="512" y="223">SIGNAL 02: PREEMPTED</text>
    <circle cx="720" cy="220" r="5" class="signal-beacon" />
    <text x="732" y="223">SIGNAL 03: PREEMPTED</text>
  </g>

  <!-- Primary Emergency Route Trajectory -->
  <g fill="none">
    <!-- Glow halo -->
    <path d="M 820,140 L 720,220 L 500,220 L 280,220 L 160,360" stroke="#00f0ff" stroke-width="12" stroke-opacity="0.22" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Core line -->
    <path d="M 820,140 L 720,220 L 500,220 L 280,220 L 160,360" stroke="#005b66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 3. ANIMATED ROUTE PROGRESSION STROKE -->
    <path d="M 820,140 L 720,220 L 500,220 L 280,220 L 160,360" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="route-flow-line" marker-mid="url(#arrow)" />
    <!-- Secondary evacuation leg to hospital (animated dashed warning red) -->
    <path d="M 500,220 L 280,220 L 160,360" stroke="#ff2a44" stroke-width="3" stroke-linecap="round" class="route-evac-line" />
  </g>

  <!-- Waypoints -->
  <g fill="#090c10" stroke="#00f0ff" stroke-width="2">
    <circle cx="720" cy="220" r="7" />
    <circle cx="280" cy="220" r="7" />
  </g>
  <g fill="#00f0ff" font-family="'SF Mono', monospace" font-size="9" text-anchor="middle">
    <text x="720" y="240">WP-01</text>
    <text x="280" y="240">WP-02</text>
  </g>

  <!-- Point 1: Unit A-04 Station Origin -->
  <g transform="translate(820, 140)">
    <circle cx="0" cy="0" r="14" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="5" fill="#00f0ff" opacity="0.6" />
    <rect x="-60" y="-38" width="120" height="22" rx="3" fill="#121a24" stroke="#00f0ff" stroke-width="1" />
    <text x="0" y="-24" fill="#00f0ff" font-family="'SF Mono', monospace" font-weight="bold" font-size="9" text-anchor="middle">A-04 STAGING POST</text>
  </g>

  <!-- Point 2: MG Road Emergency Site (Incident Location with Pulsating Radar) -->
  <g transform="translate(500, 220)">
    <!-- 2. PULSATING EMERGENCY INDICATORS -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ff2a44" class="incident-radar-pulse" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ff2a44" class="incident-radar-pulse-2" />
    
    <circle cx="0" cy="0" r="10" fill="#ff2a44" />
    <path d="M -16,0 L 16,0 M 0,-16 L 0,16" stroke="#ffffff" stroke-width="1.5" />
    <!-- Incident Label Card -->
    <rect x="-85" y="-55" width="170" height="34" rx="4" fill="#1e1014" stroke="#ff2a44" stroke-width="1.5" />
    <text x="0" y="-40" fill="#ff2a44" font-family="'SF Mono', monospace" font-weight="bold" font-size="10" text-anchor="middle">INCIDENT ARQ-2026-001</text>
    <text x="0" y="-27" fill="#ffffff" font-family="'SF Mono', monospace" font-size="8.5" text-anchor="middle">MG ROAD · CARDIAC EMERGENCY</text>
  </g>

  <!-- Point 3: Hospital Destination (Victoria Emergency Trauma) -->
  <g transform="translate(160, 360)">
    <circle cx="0" cy="0" r="22" fill="#00e676" fill-opacity="0.15" stroke="#00e676" stroke-width="1.5" />
    <!-- Cross icon -->
    <rect x="-3" y="-10" width="6" height="20" fill="#00e676" />
    <rect x="-10" y="-3" width="20" height="6" fill="#00e676" />
    <!-- Hospital Label Card -->
    <rect x="-95" y="25" width="190" height="34" rx="4" fill="#0e1f18" stroke="#00e676" stroke-width="1.2" />
    <text x="0" y="39" fill="#00e676" font-family="'SF Mono', monospace" font-weight="bold" font-size="10" text-anchor="middle">VICTORIA TRAUMA CENTRE</text>
    <text x="0" y="52" fill="#a0e0c0" font-family="'SF Mono', monospace" font-size="8.5" text-anchor="middle">DESTINATION · 12 ICU BEDS OPEN</text>
  </g>

  <!-- 1. AMBULANCE MOVEMENT ANIMATION ALONG THE ROUTE -->
  <g class="moving-ambulance-group" role="img" aria-label="Ambulance A-04 in transit along the emergency corridor">
    <!-- Ambulance Body Graphic -->
    <g transform="translate(0, 0)">
      <!-- Outer halo -->
      <circle cx="0" cy="0" r="16" fill="#00f0ff" fill-opacity="0.25" stroke="#00f0ff" stroke-width="1.5" />
      <!-- Vehicle Hull -->
      <rect x="-18" y="-10" width="36" height="20" rx="4" fill="#142030" stroke="#00f0ff" stroke-width="1.5" />
      <rect x="6" y="-7" width="9" height="14" rx="2" fill="#38bdf8" />
      <!-- Medical Cross on roof -->
      <rect x="-8" y="-4" width="6" height="8" fill="#ff2a44" />
      <rect x="-9" y="-2" width="8" height="4" fill="#ff2a44" />
      <!-- Flashing Emergency Strobe Beacons -->
      <circle cx="-1" cy="-10" r="3" class="amb-strobe-red" />
      <circle cx="3" cy="-10" r="3" class="amb-strobe-cyan" />
      <!-- Live Tag -->
      <rect x="-35" y="-26" width="70" height="14" rx="3" fill="#090c10" stroke="#00f0ff" stroke-width="1" />
      <text x="0" y="-16" fill="#00f0ff" font-family="'SF Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">A-04 [LIVE]</text>
    </g>
  </g>

  <!-- HUD Telemetry Overlay Bar (Top Right) -->
  <g transform="translate(680, 25)">
    <rect width="280" height="75" rx="6" fill="#101722" fill-opacity="0.9" stroke="#00f0ff" stroke-width="1" />
    <text x="15" y="22" fill="#00f0ff" font-family="'SF Mono', monospace" font-size="11" font-weight="bold">ROUTE TELEMETRY SUMMARY</text>
    <text x="15" y="42" fill="#e0e8f0" font-family="'SF Mono', monospace" font-size="9.5">TOTAL DISTANCE : 3.4 KM (DIRECT)</text>
    <text x="15" y="58" fill="#e0e8f0" font-family="'SF Mono', monospace" font-size="9.5">EST. TIME ARRIVAL : 04 MIN 12 SEC</text>
  </g>

  <!-- Compass Rose (Bottom Right) -->
  <g transform="translate(930, 490)">
    <circle cx="0" cy="0" r="22" fill="#0e1520" stroke="#253548" stroke-width="1" />
    <path d="M 0,-18 L 5,0 L 0,3 L -5,0 Z" fill="#ff2a44" />
    <path d="M 0,18 L 5,0 L 0,-3 L -5,0 Z" fill="#4e627a" />
    <text x="0" y="-22" fill="#ff2a44" font-family="'SF Mono', monospace" font-size="9" text-anchor="middle" font-weight="bold">N</text>
  </g>
</svg>
